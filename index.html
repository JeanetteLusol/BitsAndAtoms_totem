<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Bits & Atoms · Catálogo interactivo</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#050507;--fg:#fff;--blue:#2f5bff;--purple:#8a3dff;--mute:#9a9fb3;--grad:linear-gradient(135deg,var(--blue),var(--purple))}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;touch-action:none}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.screen{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .6s}
.screen.on{opacity:1;pointer-events:auto}
/* INTRO */
#intro .mosaic{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:4px;padding:4px}
.tile{position:relative;overflow:hidden;background:#0c0c12;opacity:.15;transform:scale(.96);transition:all .35s}
.tile.on{opacity:1;transform:scale(1)}
.tile video{width:100%;height:100%;object-fit:cover}
.tile .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:1rem;background:radial-gradient(circle at 30% 20%,var(--c),transparent 70%),#0c0c12;animation:drift 4s linear infinite alternate}
.tile .ph b{font-size:clamp(2rem,6vw,5rem);opacity:.25;line-height:1}
.tile .ph span{font-size:clamp(.7rem,1.4vw,1.1rem)}
@keyframes drift{to{background-position:40px 30px;filter:hue-rotate(25deg)}}
#intro .title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(5,5,7,.82);opacity:0;transition:opacity 1s}
#intro .title.on{opacity:1}
.title h1{font-size:clamp(3rem,11vw,9rem);letter-spacing:-.04em;line-height:.95}
.title h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;color:transparent}
.title p{margin-top:1.2rem;color:var(--mute);font-size:clamp(1rem,2vw,1.6rem)}
.btn{position:absolute;right:2rem;bottom:2rem;padding:.9rem 1.6rem;border:1px solid #fff5;border-radius:99px;background:#0008;color:#fff;font:700 1rem 'JetBrains Mono',monospace;backdrop-filter:blur(8px);cursor:pointer;z-index:5}
.btn:active{background:var(--grad)}
/* HOME */
#home{background:radial-gradient(ellipse at 50% 55%,#1b1450 0,transparent 60%),var(--bg)}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:1.5rem 2rem;z-index:4}
.logo{font-weight:700;font-size:1.4rem}.logo i{font-style:normal;color:var(--purple)}
.hud{display:flex;gap:.5rem;align-items:center;font-size:.85rem;color:var(--mute)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--mute);transition:.4s}
.dot.f{background:var(--grad);border-color:transparent;box-shadow:0 0 12px var(--purple)}
.head{position:absolute;top:18%;width:100%;text-align:center;z-index:2;pointer-events:none}
.head h2{font-size:clamp(1.6rem,4vw,3.2rem);letter-spacing:-.02em}
.head p{color:var(--mute);margin-top:.4rem}
.stage{position:absolute;left:0;right:0;top:34%;height:40%;perspective:1400px;touch-action:none}
.ring{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.card{position:absolute;width:clamp(150px,22vw,260px);height:clamp(200px,30vw,350px);margin:calc(clamp(200px,30vw,350px)/-2) 0 0 calc(clamp(150px,22vw,260px)/-2);border-radius:22px;border:1px solid #ffffff30;padding:1.1rem;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(160deg,var(--c),#0a0a14 75%);cursor:pointer;overflow:hidden}
.card .n{font-size:3.5rem;font-weight:700;opacity:.3}
.card h3{font-size:clamp(1rem,1.8vw,1.4rem)}
.card small{color:#ffffffaa}
.card.done::after{content:"✓ átomo";position:absolute;top:12px;right:12px;font:700 .7rem 'JetBrains Mono';background:var(--grad);padding:.25rem .6rem;border-radius:99px}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:90px;height:90px;border-radius:50%;background:var(--grad);filter:blur(30px);opacity:.6;pointer-events:none}
.grid{position:absolute;inset:26% 6% 12%;display:none;grid-template-columns:repeat(3,1fr);gap:1rem;align-content:start;overflow:auto}
.grid .card{position:relative;margin:0;width:auto;height:clamp(150px,22vh,240px)}
body.gridmode .stage,body.gridmode .hub{display:none}body.gridmode .grid{display:grid}
.hint{position:absolute;bottom:20%;width:100%;text-align:center;color:var(--mute);font-size:.9rem;pointer-events:none;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.foot{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:1.4rem 2rem;z-index:4}
.soc{display:flex;gap:.7rem;flex-wrap:wrap}
.soc a{padding:.55rem 1rem;border:1px solid #ffffff30;border-radius:99px;font-size:.85rem;color:#fff;text-decoration:none}
.soc a:active{background:var(--grad);border-color:transparent}
.toggle{position:static}
/* MODAL */
#modal{background:#050507f2;backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;z-index:10}
.win{width:min(1100px,94vw);max-height:92vh;overflow:auto;border:1px solid #ffffff25;border-radius:28px;background:#0b0b13;display:grid;grid-template-columns:1.25fr 1fr;transform:translateY(30px);transition:.5s}
#modal.on .win{transform:none}
.media{padding:1.2rem;display:flex;flex-direction:column;gap:.8rem}
.tabs{display:flex;gap:.5rem}.tabs button{flex:1;padding:.7rem;border-radius:12px;border:1px solid #ffffff25;background:none;color:#fff;font:700 .85rem 'JetBrains Mono';cursor:pointer}
.tabs button.a{background:var(--grad);border-color:transparent}
.view{aspect-ratio:16/10;border-radius:18px;overflow:hidden;position:relative;background:#000}
.view video{width:100%;height:100%;object-fit:cover}
.vph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,var(--c),#000 80%);font:.9rem 'JetBrains Mono';color:#fffb}
.v360{perspective:900px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.v360 img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.cube{width:150px;height:150px;transform-style:preserve-3d}
.cube div{position:absolute;inset:0;border:2px solid #fff8;display:flex;align-items:center;justify-content:center;font:700 .8rem 'JetBrains Mono';background:linear-gradient(135deg,#2f5bff99,#8a3dff99)}
.cube div:nth-child(1){transform:translateZ(75px)}.cube div:nth-child(2){transform:rotateY(180deg) translateZ(75px)}
.cube div:nth-child(3){transform:rotateY(90deg) translateZ(75px)}.cube div:nth-child(4){transform:rotateY(-90deg) translateZ(75px)}
.cube div:nth-child(5){transform:rotateX(90deg) translateZ(75px)}.cube div:nth-child(6){transform:rotateX(-90deg) translateZ(75px)}
.drag{position:absolute;bottom:8px;width:100%;text-align:center;font:.75rem 'JetBrains Mono';color:#fffa;pointer-events:none}
.info{padding:2rem 1.8rem;display:flex;flex-direction:column;gap:1rem}
.info h2{font-size:clamp(1.8rem,3.4vw,2.6rem);letter-spacing:-.02em;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}.chips span{padding:.35rem .8rem;border-radius:99px;background:#2f5bff30;border:1px solid var(--blue);font:.75rem 'JetBrains Mono'}
.lbl{font:.7rem 'JetBrains Mono';color:var(--purple);letter-spacing:.12em;text-transform:uppercase}
.info p{color:#cfd2e0;line-height:1.5}
.qr{display:flex;gap:1rem;align-items:center;margin-top:auto;padding:1rem;border-radius:18px;background:#fff;color:#000}
.qr svg,.qr canvas{width:110px;height:110px;flex:none}.qr b{display:block;font-size:1.05rem}.qr small{color:#444}
.close{position:absolute;top:1.2rem;right:1.4rem;width:56px;height:56px;border-radius:50%;border:1px solid #fff5;background:#000a;color:#fff;font-size:1.5rem;cursor:pointer;z-index:12}
#badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);padding:2rem 3rem;border-radius:26px;background:var(--grad);text-align:center;font-size:1.6rem;font-weight:700;opacity:0;pointer-events:none;transition:.5s;z-index:20}
#badge.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media(max-aspect-ratio:1/1){.win{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}#intro .mosaic{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr)}}
</style>
</head>
<body>

<!-- 1 · INTRO -->
<section id="intro" class="screen on">
  <div class="mosaic" id="mosaic"></div>
  <div class="title" id="ititle">
    <h1>Bits <em>&amp;</em><br>Atoms</h1>
    <p>Talento joven + mentoría + IoT. <br>Del código al mundo real.</p>
  </div>
  <button class="btn" id="skip">SKIP ▸▸</button>
</section>

<!-- 2 · HOME -->
<section id="home" class="screen">
  <div class="top">
    <div class="logo">Bits<i>&amp;</i>Atoms</div>
    <div class="hud mono"><span id="hudtxt"></span><span id="dots" style="display:flex;gap:.4rem"></span></div>
  </div>
  <div class="head"><h2>Descubre lo que construimos</h2><p>Desliza para girar · toca un proyecto · colecciona los átomos</p></div>
  <div class="stage" id="stage"><div class="hub"></div><div class="ring" id="ring"></div></div>
  <div class="grid" id="grid"></div>
  <div class="hint mono" id="hint">◂ desliza ▸</div>
  <div class="foot">
    <div class="soc mono">
    <a href="https://www.https://www.youtube.com/@BitsAtomsAdmira" target="_blank" rel="noopener">▶ YouTube</a>
    <a href="https://www.instagram.com/bitsatoms_" target="_blank" rel="noopener">◎ Instagram</a>
    <a href="https://bitsandatoms.ai/?utm_source=ig&utm_medium=social&utm_content=link_in_bio&fbclid=PAZXh0bgNhZW0CMTEAcGRvZgJzcnRjBmFwcF9pZA85MzY2MTk3NDMzOTI0NTkAAad9kA43SDTKzvNHcyFKc9hLbNuwwvG_RYOMwf__wDjM2x8LuNFgUOlLRc_73w_aem_mEjXqeAYDTj3eFDmXHoMHw" target="_blank" rel="noopener">⌁ bitsandatoms.ai</a>
    </div>
    <button class="btn toggle" id="toggle">VER CUADRÍCULA</button>
  </div>
</section>

<!-- 3 · MINIWEB DE PROYECTO -->
<section id="modal" class="screen">
  <button class="close" id="close">✕</button>
  <div class="win" id="win"></div>
</section>
<div id="badge">🏆 Atom Explorer<br><small style="font-weight:400">Has descubierto todos los proyectos</small></div>

<script>
/* ============ CONFIGURACIÓN (edita aquí) ============
   video: ruta a mp4 local (vacío = placeholder) · frames: array de imágenes para el 360° (vacío = cubo 3D de demostración)
   qr: URL que abrirá el QR (PDF/dossier) · Los proyectos de abajo son EJEMPLOS. */
const P=[
 {name:"Proyecto 01",sub:"Perro robot",color:"#2f5bff",keys:["IoT","Sensores","Sostenibilidad"],vision:"Ejemplo: red de sensores que mide calidad del aire en aulas y espacios públicos.",video:"",frames:[],qr:"https://bitsandatoms.ai"},
 {name:"Proyecto 02",sub:"Portero Virtual",color:"#8a3dff",keys:["Agricultura","LoRa","Datos"],vision:"Ejemplo: riego inteligente que decide según humedad y previsión.",video:"",frames:[],qr:"https://bitsandatoms.ai"},
 {name:"Proyecto 03",sub:"Máquina de Pinball",color:"#2f5bff",keys:["Edge AI","Visión","Ciudad"],vision:"Ejemplo: conteo de flujos de personas respetando la privacidad.",video:"",frames:[],qr:"https://bitsandatoms.ai"},
 {name:"Proyecto 04",sub:"Juego Jurassic Park",color:"#8a3dff",keys:["Salud","BLE","Diseño"],vision:"Ejemplo: dispositivo vestible que traduce datos del cuerpo en señales.",video:"",frames:[],qr:"https://bitsandatoms.ai"},
 {name:"Proyecto 05",sub:"Cabina terminator",color:"#2f5bff",keys:["Hogar","Matter","Automatización"],vision:"Ejemplo: espacios que se adaptan a las personas que los usan.",video:"",frames:[],qr:"https://bitsandatoms.ai"},
 {name:"Proyecto 06",sub:"Arcade de Lucha",color:"#8a3dff",keys:["Actuadores","ROS","Prototipado"],vision:"Ejemplo: brazo robótico controlado desde la nube.",video:"",frames:[],qr:"https://bitsandatoms.ai"},
 {name:"Proyecto 07",sub:"Grabación de Show Rooms",color:"#2f5bff",keys:["Internet","Objetos","Conectividad"],vision:"Ejemplo: dispositivo que permite la comunicación entre objetos del entorno.",video:"",frames:[],qr:"https://bitsandatoms.ai"},
 {name:"Proyecto 06",sub:"Portadas Munich",color:"#8a3dff",keys:["Actuadores","ROS","Prototipado"],vision:"Ejemplo: brazo robótico controlado desde la nube.",video:"",frames:[],qr:"https://bitsandatoms.ai"},

];
const IDLE_MS=60000; // vuelve a la intro tras 60 s sin tocar
/* ==================================================== */
const $=id=>document.getElementById(id), n=P.length, step=360/n, found=new Set();
const show=id=>document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id||(id==='modal'&&s.id==='home')));
let introTimer,tiles=[];

/* INTRO tipo "trailer": clips que se encienden en ráfaga */
function startIntro(){
  show('intro');$('ititle').classList.remove('on');
  const m=$('mosaic');m.innerHTML='';tiles=[];
  for(let i=0;i<12;i++){const p=P[i%n],t=document.createElement('div');t.className='tile';
    t.innerHTML=p.video?`<video src="${p.video}" muted loop autoplay playsinline></video>`:
    `<div class="ph" style="--c:${p.color}"><b class="mono">${String(i%n+1).padStart(2,'0')}</b><span class="mono">${p.sub}</span></div>`;
    m.appendChild(t);tiles.push(t)}
  const order=[...tiles.keys()].sort(()=>Math.random()-.5);let k=0;
  clearInterval(introTimer);
  introTimer=setInterval(()=>{ if(k<order.length)tiles[order[k++]].classList.add('on');
    else if(k===order.length){k++;$('ititle').classList.add('on')}
    else if(k++>order.length+10){endIntro()} },420);
}
function endIntro(){clearInterval(introTimer);show('home')}
$('skip').onclick=endIntro;

/* HOME: anillo 3D + cuadrícula */
function cardHTML(p,i){return `<div class="card" data-i="${i}" style="--c:${p.color}"><div class="n mono">${String(i+1).padStart(2,'0')}</div><div><h3>${p.name}</h3><small>${p.sub}</small></div></div>`}
$('ring').innerHTML=P.map(cardHTML).join('');$('grid').innerHTML=P.map(cardHTML).join('');
let ang=0,vel=0,drag=false,lx=0,moved=0,R=400;
function layout(){R=Math.max(260,Math.min(innerWidth*.34,innerHeight*.45));
  [...$('ring').children].forEach((c,i)=>c.dataset.base=`rotateY(${i*step}deg) translateZ(${R}px)`)}
function render(){
  $('ring').style.transform=`translateZ(${-R*.4}px) rotateY(${ang}deg)`;
  [...$('ring').children].forEach((c,i)=>{c.style.transform=c.dataset.base;
    const a=((i*step+ang)%360+540)%360-180;c.style.opacity=.25+.75*Math.max(0,Math.cos(a*Math.PI/180)+.15);});}
function loop(){if(!drag){ang+=vel;vel*=.94;if(Math.abs(vel)<.05){vel=0;const t=Math.round(ang/step)*step;ang+=(t-ang)*.08}}render();requestAnimationFrame(loop)}
const st=$('stage');
st.onpointerdown=e=>{drag=true;lx=e.clientX;moved=0;vel=0};
addEventListener('pointermove',e=>{if(!drag)return;const d=e.clientX-lx;lx=e.clientX;moved+=Math.abs(d);ang+=d*.3;vel=d*.3});
addEventListener('pointerup',()=>drag=false);
document.addEventListener('click',e=>{const c=e.target.closest('.card');if(c&&moved<8)openP(+c.dataset.i);moved=0});
$('toggle').onclick=()=>{document.body.classList.toggle('gridmode');$('toggle').textContent=document.body.classList.contains('gridmode')?'VER ANILLO 3D':'VER CUADRÍCULA'};

/* GAMIFICACIÓN */
function hud(){$('dots').innerHTML=P.map((_,i)=>`<i class="dot ${found.has(i)?'f':''}"></i>`).join('');
  $('hudtxt').textContent=`ÁTOMOS ${found.size}/${n}`;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('done',found.has(+c.dataset.i)))}

/* MINIWEB */
let m360=null;
function openP(i){
  const p=P[i];found.add(i);hud();
  $('win').innerHTML=`
  <div class="media" style="--c:${p.color}">
    <div class="tabs"><button class="a" data-t="v">▶ VÍDEO</button><button data-t="r">⟳ VISTA 360°</button></div>
    <div class="view" id="view"></div>
  </div>
  <div class="info">
    <div class="lbl">${String(i+1).padStart(2,'0')} · ${p.sub}</div>
    <h2>${p.name}</h2>
    <div><div class="lbl">Palabras clave</div><div class="chips" style="margin-top:.5rem">${p.keys.map(k=>`<span>${k}</span>`).join('')}</div></div>
    <div><div class="lbl">Visión de uso</div><p style="margin-top:.4rem">${p.vision}</p></div>
    <div class="qr"><div id="qrbox"></div><div><b>Llévate la información</b><small>Escanea con tu móvil para descargar el dossier</small></div></div>
  </div>`;
  const view=$('view'),tabs=$('win').querySelectorAll('.tabs button');
  const setTab=t=>{tabs.forEach(b=>b.classList.toggle('a',b.dataset.t===t));m360=null;
    if(t==='v')view.innerHTML=p.video?`<video src="${p.video}" autoplay loop muted playsinline></video>`:`<div class="vph" style="--c:${p.color}">[ vídeo del proyecto · añade la ruta en config ]</div>`;
    else build360(view,p)};
  tabs.forEach(b=>b.onclick=()=>setTab(b.dataset.t));setTab('v');
  try{const q=qrcode(0,'M');q.addData(p.qr);q.make();$('qrbox').innerHTML=q.createSvgTag(4,0)}catch(e){$('qrbox').innerHTML='<div style="width:110px;height:110px;border:6px solid #000"></div>'}
  $('modal').classList.add('on');
  if(found.size===n&&!window._won){window._won=1;setTimeout(()=>{$('badge').classList.add('on');setTimeout(()=>$('badge').classList.remove('on'),3500)},900)}
}
function build360(view,p){
  view.className='view v360';let rx=-15,ry=30,f=0,down=false,x0=0,y0=0;
  const hasF=p.frames&&p.frames.length;
  view.innerHTML=(hasF?`<img src="${p.frames[0]}">`:`<div class="cube" id="cube">${['FRONT','BACK','LEFT','RIGHT','TOP','BOT'].map(s=>`<div>${s}</div>`).join('')}</div>`)+`<div class="drag">arrastra para girar 360°</div>`;
  const apply=()=>{if(hasF){view.querySelector('img').src=p.frames[((Math.round(f)%p.frames.length)+p.frames.length)%p.frames.length]}else $('cube').style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`};
  apply();const me={};m360=me;
  view.onpointerdown=e=>{down=true;x0=e.clientX;y0=e.clientY;e.stopPropagation()};
  view.onpointermove=e=>{if(!down)return;ry+=(e.clientX-x0)*.6;rx-=(e.clientY-y0)*.4;f+=(e.clientX-x0)*.08;x0=e.clientX;y0=e.clientY;apply()};
  view.onpointerup=()=>down=false;
  (function auto(){if(m360!==me)return;if(!down){ry+=.4;f+=.03;apply()}requestAnimationFrame(auto)})();
}
$('close').onclick=()=>{$('modal').classList.remove('on');m360=null;$('modal').classList.remove('on');show('home')};
$('modal').onclick=e=>{if(e.target.id==='modal')$('close').onclick()};

/* Modo tótem: vuelve a la intro si nadie toca */
let idle;function reset(){clearTimeout(idle);idle=setTimeout(()=>{$('modal').classList.remove('on');m360=null;startIntro()},IDLE_MS)}
['pointerdown','pointermove'].forEach(ev=>addEventListener(ev,reset));
addEventListener('resize',layout);
layout();hud();loop();startIntro();reset();
</script>
</body>
</html>
